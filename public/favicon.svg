<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- astra mark: a single-storey 'a'. Drawn as geometry so it renders
       identically everywhere instead of depending on an installed font.
       The stem is flush with the bowl — any taller and it reads as a 'd'. -->
  <rect width="32" height="32" rx="7" fill="#2b2723"/>
  <g fill="none" stroke="#f2e8c9" stroke-width="3.4" stroke-linecap="round">
    <circle cx="14.6" cy="17.4" r="6.3"/>
    <path d="M20.9 11.6v11.6"/>
  </g>
</svg>
